[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "bitwright"
description = "Hash-consed fixed-width bit-vector expressions: exact evaluation, bit-level facts, and verified simplification."
readme = "README.md"
requires-python = ">=3.10"
license = "PolyForm-Noncommercial-1.0.0"
authors = [{ name = "binsnake" }]
keywords = ["bitvector", "smt", "simplification", "deobfuscation", "symbolic"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Compilers",
    "Typing :: Typed",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/valeria-org/bitwright"
Documentation = "https://valeria-org.github.io/bitwright/"

[tool.maturin]
python-source = "python"
module-name = "bitwright._bitwright"
