name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *" # nightly: long-running suites
  workflow_dispatch: # the nightly jobs on demand

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      # The published crate ships the license and its Required Notice: keep the copy identical.
      - run: cmp LICENSE bitwright/LICENSE
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p bitwright --no-default-features --all-targets -- -D warnings
      - run: cargo clippy -p bitwright --all-features --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test -p bitwright --all-features
      - run: cargo test -p bitwright-cli
      # The benchmarks still run (a smoke run: hosted runners have no hardware counters).
      - run: cargo run --release -p bitwright-bench -- --quick --samples 1
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # The Python bindings, their own workspace (the C and C++ ones test in `cargo test --workspace`).
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bitwright-py
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10" # the oldest the abi3 wheel supports
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
        env:
          PYO3_BUILD_EXTENSION_MODULE: "1"
      - run: pip install . pytest mypy
      - run: pytest tests
      # The type stubs match the module, and the tests type-check against them.
      - run: python -m mypy.stubtest bitwright._bitwright
      - run: python -m mypy --check-untyped-defs tests

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo check --workspace --all-targets

  nightly-deep:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libgmp10
      # The SMT suites run once per solver: every script must be accepted by both. Both are
      # pinned releases (Ubuntu's z3 4.8.12 runs for hours on some 512-bit queries).
      - run: |
          curl -sSfL -o z3.zip https://github.com/Z3Prover/z3/releases/download/z3-5.1.0/z3-5.1.0-x64-glibc-2.39.zip
          unzip -q z3.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/z3-5.1.0-x64-glibc-2.39/bin" >> "$GITHUB_PATH"
          rm z3.zip
          curl -sSfL -o bitwuzla.zip https://github.com/bitwuzla/bitwuzla/releases/download/0.9.1/Bitwuzla-Linux-x86_64-static.zip
          unzip -q bitwuzla.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/Bitwuzla-Linux-x86_64-static/bin" >> "$GITHUB_PATH"
          rm bitwuzla.zip
      - run: z3 --version && bitwuzla --version
      - run: cargo test --workspace --release -- --ignored --skip write_corpus_ledger
      - run: cargo test -p bitwright --release --all-features -- --ignored --skip write_corpus_ledger

  # The book's examples run as doctests in the test job; this builds the pages.
  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install mdbook --locked --version ^0.5
      - run: mdbook build book

  fuzz-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz build
        working-directory: fuzz

  # Five minutes per target. The corpus is not in the repository (the seeds are): each run
  # starts from the corpus the last one saved, and a crash's input is kept as an artifact.
  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: [parse_expr, compile_rules, smt_import, simplify_dag, constrain_dag, mba_solve]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - uses: actions/cache@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - run: >-
          mkdir -p corpus/${{ matrix.target }} &&
          cargo fuzz run ${{ matrix.target }} corpus/${{ matrix.target }} seeds/${{ matrix.target }}
          -- -max_total_time=300 -rss_limit_mb=2048 -timeout=10
        working-directory: fuzz
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore

  # Against the latest release tag; before the first release there is no baseline.
  semver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - id: base
        run: echo "tag=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
      - if: steps.base.outputs.tag == ''
        run: echo "::notice::no release tag yet; semver checks start at the first release"
      - if: steps.base.outputs.tag != ''
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: bitwright
          baseline-rev: ${{ steps.base.outputs.tag }}
