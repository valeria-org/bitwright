[package]
name = "bitwright-cli"
description = "Command-line tools for bitwright: check, lint, prove and catalog rule files; simplify expressions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Published after bitwright 0.1.
publish = false

[[bin]]
name = "bitwright"
path = "src/main.rs"

[dependencies]
bitwright = { path = "../bitwright", features = ["check", "smtlib", "mba"] }
bitwright-cadical = { path = "../bitwright-cadical", optional = true }

[features]
## `bitwright solve --cadical`: CaDiCaL for the long SAT searches (builds the C++ solver).
cadical = ["dep:bitwright-cadical"]

[lints]
workspace = true
