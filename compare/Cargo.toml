[package]
name = "bitwright-compare"
description = "Compares bitwright's simplification with other tools on public MBA datasets."
version = "0.0.0"
edition = "2024"
publish = false
license = "PolyForm-Noncommercial-1.0.0"

# Its own workspace: it depends on other engines (egg, CoBRA's Rust port, and with
# `native-smt` z3 and Bitwuzla) that the main workspace should not build, and it is run by
# hand, not in CI.
[workspace]
members = ["."]

[dependencies]
bitwright = { path = "../bitwright", features = ["mba", "smtlib", "eqsat"] }
cobra = { package = "cobra-mba", version = "0.4" }
egg = "0.11"
libc = { version = "0.2", optional = true }

[features]
# `versus-smt`, linked against z3 and Bitwuzla releases (`Z3_DIR`, `BITWUZLA_DIR`; see the README).
native-smt = []
# PROTOTYPE (solver-budget investigation): `BW_CALLS=FILE` records every MBA solver call.
probe = ["bitwright/cost-probe", "dep:libc"]

[[bin]]
name = "versus-smt"
required-features = ["native-smt"]

[profile.release]
debug = 1

# Not the main workspace's lints: counting heap use needs `unsafe` (one module, `heap`).
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
